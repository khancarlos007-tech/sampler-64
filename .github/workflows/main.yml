name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compila
        run: |
          if [ -f Sampler64.zip ]; then unzip -oq Sampler64.zip -d proj; cd proj; fi
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/Sampler64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Sampler64-apk
          path: out/Sampler64.apk
